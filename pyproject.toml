[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MoCloPlanner"
version = "0.1.0"
description = "A Streamlit and command-line planner for Golden Gate / MoClo reactions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0,<4.0",
    "openpyxl>=3.1,<4.0",
    "streamlit>=1.30,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
mocloplanner-cli = "moclo_cli:main"

[tool.setuptools]
py-modules = ["moclo_core", "moclo_assembly", "moclo_standards", "moclo_cli", "moclo_gui"]
